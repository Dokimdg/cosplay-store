{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
    <div class="card shadow-sm p-4">
        <h2 class="h4 mb-3">Вхід</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-dark w-100">Увійти</button>
        </form>
        <p class="mt-3 mb-0 small">Ще немає акаунта? <a href="{% url 'accounts:register' %}">Реєстрація</a></p>
    </div>
</div>
{% endblock %}
