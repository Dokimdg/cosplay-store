{% extends "base.html" %}
{% block title %}Профіль{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
    <div class="card shadow-sm p-4">
        <h2 class="h4 mb-1">👋 {{ user.username }}</h2>
        <p class="text-muted">{{ user.email }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark">Зберегти</button>
        </form>
    </div>
</div>
{% endblock %}
