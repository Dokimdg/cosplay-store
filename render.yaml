services:
  - type: web
    name: cosplayshop
    env: docker
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"